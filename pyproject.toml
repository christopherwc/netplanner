[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netplanner"
version = "0.1.0"
description = "Network planning tool with GUI, persistent storage, and PDF/PNG export"
readme = "README.md"   # also what `twine check --strict` needs to pass
requires-python = ">=3.12"
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
# Pinned exactly, not floored. See "Dependency pinning" in README.md for
# why, and for how to move a pin. uv.lock records the hash of every
# artifact these resolve to; the two are updated together.
dependencies = [
    "PyQt6==6.11.0",
    "networkx==3.6.1",
    "numpy==2.5.2",       # required by networkx layout algorithms (spring/circular)
    "scipy==1.18.1",      # required by networkx kamada_kawai layout
    "SQLAlchemy==2.0.52",
    "reportlab==5.0.1",
    "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage[toml]==7.15.4",   # --format=markdown for CI job summaries
    "ruff==0.16.5",
    "mypy==2.3.1",
    "build==1.6.0",
    "twine==7.0.0",
    "pip-audit==2.10.1",
]
# Unpinned on purpose: nothing in netplanner imports pygraphviz, and it
# needs system Graphviz headers to build. Pinning a package the project
# does not use, cannot install here, and does not test would be a
# version number nobody verifies.
layout = ["pygraphviz>=1.12"]

[project.urls]
Homepage = "https://github.com/christopherwc/netplanner"
Issues = "https://github.com/christopherwc/netplanner/issues"

[project.scripts]
netplanner = "netplanner.main:main"

[tool.setuptools.packages.find]
include = ["netplanner*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately curated rather than "everything": these are the families
# that catch real defects (F), stale imports and dead names (F401/F841),
# outdated idioms (UP), likely bugs (B), keep import order stable across
# machines (I), and flag the patterns bandit looks for (S) — eval, weak
# hashes, shelling out, hardcoded temp paths. Style-only opinions are
# left out.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 flags `assert`, which is the point of a test. The rule exists
# because an assert in shipped code vanishes under `python -O`; that
# reasoning does not reach a test suite, which is never run that way.
#
# Everything else in S applies to the tests as much as to the package —
# S108 (hardcoded /tmp paths) was a real finding here, and is why this
# is an ignore for one rule rather than for the whole directory.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# Warnings are failures: a DeprecationWarning from PyQt6 or SQLAlchemy is
# how the next breaking release announces itself, and the scheduled CI run
# is where we want to hear it — not on launch day.
filterwarnings = ["error"]
# Coverage flags are deliberately NOT in addopts: `pytest -k something`
# would then trip the 100% gate on a partial run. CI passes them.

[tool.coverage.run]
source = ["netplanner"]
# Branch coverage as well as line. A line gate alone passes a guard
# whose false side has never run, which is how every `if device:` in
# the command stack shipped untested: the line executed on the true
# path every time and the guard itself was never exercised.
branch = true

[tool.coverage.report]
show_missing = true
# Every line and every branch, with nothing excluded: there is not a
# single `# pragma: no cover` or `# pragma: no branch` in the package.
# A pragma is a claim that a line cannot run, and the claims here were
# wrong often enough that the rule is now to test the path or delete it.
fail_under = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

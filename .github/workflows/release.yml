name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release from (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  # Reuses ci.yml rather than repeating a trimmed-down version of it, so
  # a tag can never be released under weaker checks than a pull request.
  verify:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # A tag that disagrees with the packaged version produces a
      # release whose artifacts are named after a different release.
      # Cheaper to fail here than to explain it later.
      - name: Check the tag matches the packaged version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag packaged version=$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match version $version in pyproject.toml"
            exit 1
          fi

      # Built from the lock, so the artifacts attached to a release are
      # produced against the same dependency set CI verified.
      - name: Build distributions
        run: |
          uv build
          uv run --locked --extra dev twine check --strict dist/*

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      # Uses the GitHub CLI, already on the runner, rather than a
      # third-party release action: one less unpinned dependency with
      # write access to the repository.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --title "NetPlanner $tag" \
            --generate-notes \
            --verify-tag \
            dist/*

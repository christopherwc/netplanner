name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A weekly run catches the things a commit-triggered pipeline never
  # sees: a new PyQt6 or SQLAlchemy release that breaks us, or a CVE
  # filed against a dependency we have not touched in months.
  schedule:
    - cron: "17 6 * * 1"
  # Callable from release.yml so a tag runs the identical pipeline
  # rather than a second, drifting copy of it.
  workflow_call:
  workflow_dispatch:

# Superseded runs on the same branch are pointless; cancel them. Never
# cancel on main or tags, where the run is a record of what shipped.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Qt has no display on a runner; the offscreen plugin renders for real
  # into memory, which is what the canvas tests need.
  QT_QPA_PLATFORM: offscreen
  FORCE_COLOR: "1"
  # Fail rather than silently re-resolve if any step reaches for a
  # dependency uv.lock does not already account for, or if the lock has
  # fallen behind pyproject.toml.
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # --output-format=github turns findings into inline PR annotations
      # on the offending line instead of a wall of log text.
      - name: Check
        run: uv run ruff check --output-format=github .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Blocking. mypy reports zero errors on netplanner/, so this is a
      # ratchet rather than a report: a new Optional read through, or a
      # signature that no longer matches the Qt base class it overrides,
      # fails the run instead of being appended to a list nobody reads.
      - name: Run mypy
        run: uv run mypy netplanner

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      # --cov-fail-under=100 is the gate: the suite covers every line
      # today, so a drop means new code arrived without tests.
      - name: Run tests
        run: |
          uv run pytest \
            --cov=netplanner \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 \
            --junitxml=junit-${{ matrix.python-version }}.xml

      - name: Coverage summary
        if: ${{ always() && matrix.python-version == '3.12' }}
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python-version }})"
            echo ""
            uv run python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit-${{ matrix.python-version }}.xml
            coverage.xml
          retention-days: 14
          if-no-files-found: warn

  startup:
    name: Startup smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Installs the built package, not an editable checkout: this job
      # is about what a user gets from `pip install netplanner`.
      - uses: ./.github/actions/setup
        with:
          sync-args: --no-editable
      # The outer timeout is a hang guard only: the driver quits itself
      # ~1.5s after the event loop starts, so a timeout here means the
      # app wedged during startup, which is also a failure worth seeing.
      - name: Launch the app and quit cleanly
        env:
          NETPLANNER_LOG_DIR: ${{ runner.temp }}/netplanner-logs
          XDG_DATA_HOME: ${{ runner.temp }}/netplanner-data
        run: timeout 90 uv run --no-sync python .github/scripts/startup_smoke.py
      - name: Show the startup log
        if: ${{ always() }}
        run: cat ${{ runner.temp }}/netplanner-logs/*.log || echo "no log written"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Audited from uv.lock rather than a hand-kept requirements file,
      # so what is scanned is exactly what gets installed. Exported at
      # audit time instead of committed, because a checked-in copy is
      # one more thing that can silently disagree with the lock.
      - name: Export the locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project \
            --format requirements-txt -o locked-requirements.txt
          cat locked-requirements.txt
      - name: Audit the locked dependencies
        run: |
          uv run pip-audit \
            --requirement locked-requirements.txt \
            --progress-spinner off

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Qt libraries are needed even here: the verification step below
      # imports netplanner.gui out of the installed wheel.
      - uses: ./.github/actions/setup
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uv run twine check --strict dist/*
      # Installing the built wheel into a clean venv catches packaging
      # mistakes an editable install hides: a subpackage missing from
      # the find directive, or a console script that does not resolve.
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/verify
          VIRTUAL_ENV=/tmp/verify uv pip install dist/*.whl
          /tmp/verify/bin/python -c "
          import importlib
          for module in ('app.controller', 'gui.main_window', 'export.pdf_exporter',
                         'persistence.repository'):
              importlib.import_module(f'netplanner.{module}')
          print('import check ok')
          "
          test -x /tmp/verify/bin/netplanner
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  # One job to require in branch protection. Without it, adding a job to
  # the matrix above silently makes it optional, because the required
  # checks list still names the old ones.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, startup, audit, package]
    if: ${{ always() }}
    steps:
      - name: Verify every required job succeeded
        run: |
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "test:     ${{ needs.test.result }}"
          echo "startup:  ${{ needs.startup.result }}"
          echo "audit:    ${{ needs.audit.result }}"
          echo "package:  ${{ needs.package.result }}"
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false" ]

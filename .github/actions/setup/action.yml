name: Set up Python and the Qt runtime
description: >
  Installs a Python toolchain plus the system libraries PyQt6 links
  against, then installs this project. Shared by every job that has to
  import netplanner.gui, so the library list cannot drift between them.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  install:
    description: Arguments passed to pip install (empty to skip)
    required: false
    default: -e ".[dev]"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    # PyQt6 wheels bundle Qt itself, but Qt still links against the
    # system EGL/GL, xkbcommon, dbus and fontconfig libraries. Without
    # them the offscreen platform plugin refuses to load and every GUI
    # test fails with a bare "could not load the Qt platform plugin".
    - name: Install Qt runtime libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

    - name: Install project
      if: ${{ inputs.install != '' }}
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install ${{ inputs.install }}

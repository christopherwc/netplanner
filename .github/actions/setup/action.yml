name: Set up uv, Python and the Qt runtime
description: >
  Installs uv, a Python toolchain, and the system libraries PyQt6 links
  against, then materialises the environment from uv.lock. Shared by
  every job that has to import netplanner.gui, so neither the library
  list nor the resolved dependency set can drift between them.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  sync-args:
    description: >
      Extra arguments for `uv sync`. Empty skips the sync entirely, for
      jobs that build the project rather than run it.
    required: false
    default: --extra dev

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
      with:
        # uv is itself a dependency with repository access, so it is
        # pinned like everything else rather than tracking latest.
        version: "0.12.7"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    # PyQt6 wheels bundle Qt itself, but Qt still links against the
    # system EGL/GL, xkbcommon, dbus and fontconfig libraries. Without
    # them the offscreen platform plugin refuses to load and every GUI
    # test fails with a bare "could not load the Qt platform plugin".
    - name: Install Qt runtime libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1

    # --locked, not --frozen. Both install exactly what uv.lock records,
    # but --frozen accepts a lock that no longer matches pyproject.toml,
    # which is the one case worth failing on: it means someone edited a
    # version and did not re-lock, so CI would test a dependency set
    # nobody declared.
    - name: Sync the locked environment
      if: ${{ inputs.sync-args != '' }}
      shell: bash
      run: uv sync --locked --python ${{ inputs.python-version }} ${{ inputs.sync-args }}

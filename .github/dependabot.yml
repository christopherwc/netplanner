version: 2
updates:
  # Python dependencies. Every version is pinned, so these PRs are the
  # mechanism by which a pin ever moves: without them the pins go stale
  # and stale pins miss security fixes. Grouped so a quiet week produces
  # one PR rather than six, each of which would otherwise run the full
  # matrix.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"

  # Workflow actions. These run with repository credentials, so a stale
  # pinned action is a supply-chain problem, not just old code.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Base images. Pinned by digest, so these PRs are the only way a base
  # image ever picks up a security update — a digest that nobody moves
  # is a frozen copy of whatever CVEs it shipped with.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "build"
